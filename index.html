<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickQuote Pro - Professional Invoice & Quote Generator</title>
    <meta name="description" content="Generate professional invoices and quotes in seconds. 30+ professions, 20+ currencies. Export PDF/Image. Perfect for service businesses.">
    <meta name="keywords" content="invoice generator, quote maker, bill generator, service invoice, professional receipts">
    <link rel="canonical" href="https://service-quote-generator.vercel.app/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="QuickQuote Pro - Professional Invoice Generator">
    <meta property="og:description" content="Generate professional invoices and quotes in seconds.">
    <meta name="theme-color" content="#075e54">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
        
        body {
            scroll-behavior: smooth;
            transition: background-color 0.3s ease;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .dark .glass {
            background: rgba(15, 15, 25, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gradient-text {
            background: linear-gradient(135deg, #075e54 0%, #25D366 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(7, 94, 84, 0.2);
        }

        .invoice-card {
            background: white;
            color: #1a1a1a;
            padding: 40px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        .invoice-label {
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tab-active {
            color: #075e54;
            border-bottom: 3px solid #075e54;
        }

        .dark .tab-active {
            color: #25D366;
            border-bottom-color: #25D366;
        }

        /* Responsive fixes */
        @media (max-width: 640px) {
            .invoice-card {
                padding: 20px;
            }
            .hide-on-mobile { display: none; }
        }

        /* Prevent overflow in flex items */
        .flex-row-responsive {
            display: flex;
            gap: 0.5rem;
            min-width: 0;
        }
        .flex-row-responsive > * {
            min-width: 0;
        }

        /* Dark mode inputs */
        .dark input, .dark select, .dark textarea {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }

        .dark input::placeholder {
            color: #64748b !important;
        }

        /* Toast */
        .toast {
            animation: slideIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 transition-colors duration-300">

    <!-- Header -->
    <header class="fixed top-0 w-full z-50 glass border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="location.href=location.pathname">
                <div class="w-8 h-8 bg-emerald-600 rounded flex items-center justify-center text-white font-bold">Q</div>
                <span class="text-xl font-black dark:text-white">QuickQuote <span class="text-emerald-600">Pro</span></span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block text-yellow-400"></i>
                </button>
                <button id="installApp" class="hidden sm:flex items-center gap-2 bg-slate-900 dark:bg-white dark:text-slate-900 text-white px-4 py-2 rounded-full text-sm font-bold hover:opacity-90">
                    <i data-lucide="download" class="w-4 h-4"></i> Install
                </button>
            </div>
        </div>
    </header>

    <!-- Shared View Mode (Auto-populated via URL) -->
    <div id="view-mode" class="hidden pt-24 pb-12 px-4 min-h-screen">
        <div class="max-w-4xl mx-auto">
            <div class="mb-6 flex gap-2 flex-wrap justify-center sm:justify-start">
                <button onclick="downloadImage()" class="flex items-center gap-2 px-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-bold hover:bg-slate-50 transition-all">
                    <i data-lucide="image" class="w-4 h-4"></i> JPG
                </button>
                <button onclick="downloadPDF()" class="flex items-center gap-2 px-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-bold hover:bg-slate-50 transition-all">
                    <i data-lucide="file-text" class="w-4 h-4"></i> PDF
                </button>
                <button onclick="window.print()" class="flex items-center gap-2 px-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-bold hover:bg-slate-50 transition-all">
                    <i data-lucide="printer" class="w-4 h-4"></i> Print
                </button>
                <button onclick="shareLink()" class="flex items-center gap-2 px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-bold hover:bg-emerald-700 transition-all">
                    <i data-lucide="share-2" class="w-4 h-4"></i> Share Link
                </button>
                <button id="backBtn" onclick="backToEdit()" class="flex items-center gap-2 px-4 py-2 bg-slate-200 dark:bg-slate-800 rounded-lg text-sm font-bold hover:bg-slate-300 transition-all">
                    <i data-lucide="edit-3" class="w-4 h-4"></i> Edit
                </button>
            </div>
            <div id="invoice-capture-area" class="bg-white rounded-xl shadow-2xl overflow-hidden border border-slate-200">
                <div id="invoice-render" class="invoice-card"></div>
            </div>
        </div>
    </div>

    <!-- Edit Mode -->
    <div id="edit-mode" class="pt-24 pb-12 px-4 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- Form Column -->
        <div class="space-y-6">
            <div class="text-center lg:text-left mb-8">
                <h1 class="text-4xl font-black mb-2 dark:text-white">Create <span class="gradient-text">Professional</span> Bills</h1>
                <p class="text-slate-500 dark:text-slate-400">Trusted by 10,000+ service providers worldwide.</p>
            </div>

            <div class="bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <!-- Tabs -->
                <div class="flex border-b border-slate-200 dark:border-slate-800 mb-8 -mx-6 sm:-mx-8 px-6 sm:px-8">
                    <button onclick="setMode('customer')" id="tab-cust" class="flex-1 pb-4 font-bold text-base tab-active">Customer Request</button>
                    <button onclick="setMode('worker')" id="tab-work" class="flex-1 pb-4 font-bold text-base text-slate-400">Worker Invoice</button>
                </div>

                <div class="space-y-6">
                    <!-- Numbers & Date -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="invoice-label" id="id-label">Request Number</label>
                            <input type="text" id="doc_id" readonly class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg font-mono text-xs">
                        </div>
                        <div class="space-y-1">
                            <label class="invoice-label">Date</label>
                            <input type="date" id="doc_date" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm">
                        </div>
                    </div>

                    <!-- Worker Info (Conditional) -->
                    <div id="worker-fields" class="hidden space-y-4 animate-fade">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="invoice-label">Business Name</label>
                                <input type="text" id="w_biz" placeholder="e.g. Fast Fixers" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm">
                            </div>
                            <div class="space-y-1">
                                <label class="invoice-label">Worker Name</label>
                                <input type="text" id="w_name" placeholder="Your Name" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm">
                            </div>
                        </div>
                        <div class="space-y-1">
                            <label class="invoice-label">Business Logo</label>
                            <input type="file" id="w_logo" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-emerald-50 file:text-emerald-700">
                        </div>
                    </div>

                    <!-- Customer Info -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="invoice-label">Customer Name *</label>
                            <input type="text" id="c_name" placeholder="Name" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm">
                        </div>
                        <div class="space-y-1">
                            <label class="invoice-label">Phone</label>
                            <input type="tel" id="c_phone" placeholder="Phone" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm">
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="invoice-label">Address</label>
                        <input type="text" id="c_addr" placeholder="Street, City, Country" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm">
                    </div>

                    <!-- Settings -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="invoice-label">Profession</label>
                            <select id="prof" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm">
                                <option>Plumber</option><option>Electrician</option><option>Cleaner</option><option>AC Technician</option>
                                <option>Painter</option><option>Mechanic</option><option>Carpenter</option><option>Mason</option>
                                <option>Welder</option><option>Gardener</option><option>Handyman</option><option>Roofer</option>
                                <option>Pest Control</option><option>Locksmith</option><option>Solar Tech</option><option>CCTV Installer</option>
                                <option>Computer Repair</option><option>Interior Designer</option><option>House Shifting</option><option>Other</option>
                            </select>
                        </div>
                        <div class="space-y-1">
                            <label class="invoice-label">Currency</label>
                            <select id="curr" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm">
                                <option value="USD">USD ($)</option><option value="SAR">SAR (SR)</option><option value="AED">AED (dh)</option>
                                <option value="PKR">PKR (Rs)</option><option value="INR">INR (₹)</option><option value="EUR">EUR (€)</option>
                                <option value="GBP">GBP (£)</option><option value="QAR">QAR (QR)</option><option value="KWD">KWD (KD)</option>
                                <option value="BHD">BHD (BD)</option><option value="OMR">OMR (OR)</option><option value="CAD">CAD ($)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Dynamic Items -->
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <label class="invoice-label">Services / Items</label>
                            <button onclick="addItem()" class="text-xs font-black text-emerald-600 flex items-center gap-1 hover:underline">
                                <i data-lucide="plus-circle" class="w-3 h-3"></i> Add Item
                            </button>
                        </div>
                        <div id="items-container" class="space-y-2"></div>
                    </div>

                    <!-- Totals & Status -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="invoice-label">Tax (%)</label>
                            <input type="number" id="tax" value="0" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm">
                        </div>
                        <div class="space-y-1">
                            <label class="invoice-label">Discount (%)</label>
                            <input type="number" id="disc" value="0" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="invoice-label">Payment Status</label>
                        <div class="flex gap-2">
                            <button onclick="setStatus('Pending')" id="st-Pending" class="flex-1 py-2 rounded-lg border border-slate-200 text-xs font-bold transition-all bg-emerald-600 text-white border-emerald-600">Pending</button>
                            <button onclick="setStatus('Paid')" id="st-Paid" class="flex-1 py-2 rounded-lg border border-slate-200 text-xs font-bold transition-all hover:bg-emerald-50">Paid</button>
                            <button onclick="setStatus('Partial')" id="st-Partial" class="flex-1 py-2 rounded-lg border border-slate-200 text-xs font-bold transition-all hover:bg-emerald-50">Partial</button>
                        </div>
                    </div>

                    <!-- Payment Method (Worker Only) -->
                    <div id="pay-method-field" class="hidden space-y-1 animate-fade">
                        <label class="invoice-label">Payment Method</label>
                        <select id="pay_method" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm">
                            <option>Cash</option><option>Bank Transfer</option><option>Credit Card</option><option>Debit Card</option>
                            <option>UPI</option><option>Apple Pay</option><option>Google Pay</option><option>PayPal</option>
                            <option>STC Pay</option><option>Tabby</option><option>Tamara</option><option>Other</option>
                        </select>
                    </div>

                    <div class="space-y-1">
                        <label class="invoice-label">Notes</label>
                        <textarea id="notes" rows="2" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm"></textarea>
                    </div>

                    <div class="flex gap-3 pt-4">
                        <button onclick="resetAll()" class="flex-1 py-4 border border-slate-200 rounded-xl font-bold text-slate-500 hover:bg-slate-50 transition-all">Reset</button>
                        <button onclick="goToPreview()" class="flex-[2] py-4 btn-primary text-white rounded-xl font-black shadow-lg">Generate & Share</button>
                    </div>
                </div>
            </div>

            <!-- History -->
            <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800">
                <h3 class="font-black mb-4 flex items-center gap-2 dark:text-white"><i data-lucide="history" class="w-5 h-5"></i> Recent History</h3>
                <div id="history-box" class="space-y-2 max-h-48 overflow-y-auto pr-2"></div>
            </div>
        </div>

        <!-- Preview Column (Desktop) -->
        <div class="hidden lg:block sticky top-24">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-black dark:text-white">Live Preview</h2>
                <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded">Auto-updating</span>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 overflow-hidden" style="max-height: 800px; overflow-y: auto;">
                <div id="preview-render" class="invoice-card" style="transform: scale(0.9); transform-origin: top center; box-shadow: none;"></div>
            </div>
        </div>
    </div>

    <div id="toast-root" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-2"></div>

    <script>
        // CONFIG & STATE
        let state = {
            mode: 'customer', // 'customer' or 'worker'
            status: 'Pending',
            items: [{ id: Date.now(), desc: '', amt: 0 }],
            logo: null,
            history: JSON.parse(localStorage.getItem('qq_v2_history') || '[]')
        };

        const CURR_MAP = { USD: '$', SAR: 'SR', AED: 'dh', PKR: 'Rs', INR: '₹', EUR: '€', GBP: '£', QAR: 'QR', KWD: 'KD', BHD: 'BD', OMR: 'OR', CAD: '$' };

        // INITIALIZE
        window.onload = () => {
            lucide.createIcons();
            renderItems();
            renderHistory();
            generateID();
            document.getElementById('doc_date').valueAsDate = new Date();
            
            // Check URL for shared data
            const params = new URLSearchParams(window.location.search);
            if (params.has('data')) {
                try {
                    const decoded = JSON.parse(atob(params.get('data')));
                    displayShared(decoded);
                } catch(e) { showToast('Invalid shared link', 'error'); }
            }

            // Bind live updates
            const inputs = ['w_biz', 'w_name', 'c_name', 'c_phone', 'c_addr', 'prof', 'curr', 'tax', 'disc', 'notes', 'doc_date', 'pay_method'];
            inputs.forEach(id => document.getElementById(id).addEventListener('input', updatePreviews));
            document.getElementById('w_logo').addEventListener('change', handleLogo);
        };

        // CORE FUNCTIONS
        function setMode(m) {
            state.mode = m;
            document.getElementById('tab-cust').className = `flex-1 pb-4 font-bold text-base transition-all ${m==='customer' ? 'tab-active' : 'text-slate-400'}`;
            document.getElementById('tab-work').className = `flex-1 pb-4 font-bold text-base transition-all ${m==='worker' ? 'tab-active' : 'text-slate-400'}`;
            document.getElementById('worker-fields').classList.toggle('hidden', m!=='worker');
            document.getElementById('pay-method-field').classList.toggle('hidden', m!=='worker');
            document.getElementById('id-label').innerText = m==='customer' ? 'Request Number' : 'Invoice Number';
            generateID();
            updatePreviews();
        }

        function generateID() {
            const d = new Date();
            const dateStr = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
            const prefix = state.mode === 'customer' ? 'REQ' : 'INV';
            document.getElementById('doc_id').value = `${prefix}-${dateStr}-${Math.floor(1000 + Math.random() * 9000)}`;
        }

        function handleLogo(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (re) => { state.logo = re.target.result; updatePreviews(); };
                reader.readAsDataURL(file);
            }
        }

        function addItem() {
            state.items.push({ id: Date.now(), desc: '', amt: 0 });
            renderItems();
            updatePreviews();
        }

        function removeItem(id) {
            if (state.items.length > 1) {
                state.items = state.items.filter(i => i.id !== id);
                renderItems();
                updatePreviews();
            }
        }

        function updateItem(id, key, val) {
            const item = state.items.find(i => i.id === id);
            if (item) {
                item[key] = key === 'amt' ? parseFloat(val) || 0 : val;
                updatePreviews();
            }
        }

        function renderItems() {
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            state.items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flex-row-responsive items-center animate-fade';
                div.innerHTML = `
                    <input type="text" placeholder="Service description..." value="${item.desc}" oninput="updateItem(${item.id}, 'desc', this.value)" class="flex-[3] px-3 py-2 border border-slate-200 rounded-lg text-xs">
                    <input type="number" placeholder="Price" value="${item.amt}" oninput="updateItem(${item.id}, 'amt', this.value)" class="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-xs">
                    <button onclick="removeItem(${item.id})" class="p-1 text-slate-300 hover:text-red-500"><i data-lucide="x" class="w-4 h-4"></i></button>
                `;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        function setStatus(s) {
            state.status = s;
            ['Pending', 'Paid', 'Partial'].forEach(st => {
                const btn = document.getElementById(`st-${st}`);
                btn.className = `flex-1 py-2 rounded-lg border border-slate-200 text-xs font-bold transition-all ${s===st ? 'bg-emerald-600 text-white border-emerald-600' : 'hover:bg-emerald-50'}`;
            });
            updatePreviews();
        }

        // RENDER LOGIC
        function buildInvoiceHTML(data, isFull = false) {
            const sym = CURR_MAP[data.curr] || '$';
            let sub = 0; data.items.forEach(i => sub += i.amt);
            const tAmt = (sub * data.tax) / 100;
            const dAmt = (sub * data.disc) / 100;
            const total = sub + tAmt - dAmt;

            return `
                <div class="flex justify-between items-start mb-8">
                    <div>
                        ${data.logo ? `<img src="${data.logo}" class="w-16 h-16 rounded object-cover">` : `<div class="w-12 h-12 bg-emerald-50 rounded flex items-center justify-center text-emerald-600"><i data-lucide="briefcase"></i></div>`}
                    </div>
                    <div class="text-right">
                        <h2 class="text-2xl font-black tracking-tighter">${data.mode === 'customer' ? 'REQUEST' : 'INVOICE'}</h2>
                        <p class="text-[10px] font-mono text-slate-400">${data.id}</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-8 mb-8 text-xs">
                    <div>
                        <p class="invoice-label mb-1">From</p>
                        <p class="font-extrabold text-sm">${data.mode==='worker' ? (data.w_biz || 'Business') : 'Service Request'}</p>
                        ${data.mode==='worker' && data.w_name ? `<p class="text-slate-500">${data.w_name}</p>` : ''}
                        <p class="text-slate-500 italic">${data.prof}</p>
                    </div>
                    <div class="text-right">
                        <p class="invoice-label mb-1">To</p>
                        <p class="font-extrabold text-sm">${data.c_name || 'Customer'}</p>
                        ${data.c_phone ? `<p class="text-slate-500">${data.c_phone}</p>` : ''}
                        ${data.c_addr ? `<p class="text-slate-500">${data.c_addr}</p>` : ''}
                        <p class="text-slate-400 mt-1">${new Date(data.date).toLocaleDateString()}</p>
                    </div>
                </div>

                <div class="border-y-2 border-slate-900 py-4 mb-6">
                    <div class="flex justify-between invoice-label mb-2"><span>Description</span><span>Amount</span></div>
                    ${data.items.map(i => `
                        <div class="flex justify-between text-xs py-2 border-b border-slate-50">
                            <span class="font-medium">${i.desc || 'Service'}</span>
                            <span class="font-black">${sym}${i.amt.toLocaleString()}</span>
                        </div>
                    `).join('')}
                </div>

                <div class="flex justify-end mb-8">
                    <div class="w-40 space-y-2 text-xs">
                        <div class="flex justify-between text-slate-500"><span>Subtotal</span><span>${sym}${sub.toLocaleString()}</span></div>
                        ${data.tax > 0 ? `<div class="flex justify-between text-slate-500"><span>Tax (${data.tax}%)</span><span>${sym}${tAmt.toLocaleString()}</span></div>` : ''}
                        ${data.disc > 0 ? `<div class="flex justify-between text-slate-500"><span>Discount (${data.disc}%)</span><span>-${sym}${dAmt.toLocaleString()}</span></div>` : ''}
                        <div class="flex justify-between pt-2 border-t border-slate-900 font-black text-sm">
                            <span>TOTAL</span>
                            <span class="text-emerald-600">${sym}${total.toLocaleString()}</span>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-end">
                    <div id="${isFull ? 'qr-full' : 'qr-pre'}" class="opacity-80"></div>
                    <div class="text-right">
                        <div class="inline-block px-3 py-1 rounded-full text-[9px] font-black uppercase mb-2 ${data.status==='Paid'?'bg-emerald-600 text-white':'bg-amber-500 text-white'}">${data.status}</div>
                        ${data.mode==='worker' ? `<p class="text-[9px] text-slate-400 mb-1">Payment: ${data.pay_method}</p>` : ''}
                        <div class="text-[8px] font-bold text-slate-300 uppercase leading-tight">QuickQuote Pro<br>service-quote-generator.vercel.app</div>
                    </div>
                </div>

                ${data.notes ? `<div class="mt-8 pt-4 border-t border-slate-100 text-[10px] text-slate-500"><p class="font-bold uppercase mb-1">Notes</p><p>${data.notes}</p></div>` : ''}
            `;
        }

        function updatePreviews() {
            const data = getCurrentData();
            document.getElementById('preview-render').innerHTML = buildInvoiceHTML(data);
            lucide.createIcons();
            const qrBox = document.getElementById('qr-pre');
            if(qrBox) {
                qrBox.innerHTML = '';
                new QRCode(qrBox, { text: window.location.origin + "?data=" + btoa(JSON.stringify(data)), width: 45, height: 45, colorDark: "#0f172a" });
            }
        }

        function getCurrentData() {
            return {
                id: document.getElementById('doc_id').value,
                date: document.getElementById('doc_date').value,
                mode: state.mode,
                status: state.status,
                w_biz: document.getElementById('w_biz').value,
                w_name: document.getElementById('w_name').value,
                c_name: document.getElementById('c_name').value,
                c_phone: document.getElementById('c_phone').value,
                c_addr: document.getElementById('c_addr').value,
                prof: document.getElementById('prof').value,
                curr: document.getElementById('curr').value,
                tax: parseFloat(document.getElementById('tax').value) || 0,
                disc: parseFloat(document.getElementById('disc').value) || 0,
                notes: document.getElementById('notes').value,
                pay_method: document.getElementById('pay_method').value,
                items: state.items,
                logo: state.logo
            };
        }

        // VIEW & SHARE
        function goToPreview() {
            const data = getCurrentData();
            if(!data.c_name) return showToast('Customer name required', 'error');
            
            // Save to history
            state.history = [data, ...state.history.filter(h => h.id !== data.id)].slice(0, 20);
            localStorage.setItem('qq_v2_history', JSON.stringify(state.history));
            renderHistory();

            displayShared(data);
            window.scrollTo(0,0);
        }

        function displayShared(data) {
            document.getElementById('edit-mode').classList.add('hidden');
            document.getElementById('view-mode').classList.remove('hidden');
            document.getElementById('invoice-render').innerHTML = buildInvoiceHTML(data, true);
            lucide.createIcons();
            
            const qrBox = document.getElementById('qr-full');
            if(qrBox) {
                qrBox.innerHTML = '';
                new QRCode(qrBox, { text: window.location.origin + "?data=" + btoa(JSON.stringify(data)), width: 70, height: 70, colorDark: "#0f172a" });
            }
            
            // Hide back button if just viewing shared link
            const params = new URLSearchParams(window.location.search);
            document.getElementById('backBtn').classList.toggle('hidden', params.has('data') && !state.history.some(h => h.id === data.id));
        }

        function backToEdit() {
            document.getElementById('view-mode').classList.add('hidden');
            document.getElementById('edit-mode').classList.remove('hidden');
            // Remove data from URL without reload
            window.history.pushState({}, '', window.location.pathname);
        }

        function shareLink() {
            const data = getCurrentData();
            const url = window.location.origin + window.location.pathname + "?data=" + btoa(JSON.stringify(data));
            
            if (navigator.share) {
                navigator.share({ title: data.id, text: 'View Invoice', url: url });
            } else {
                navigator.clipboard.writeText(url);
                showToast('Link copied to clipboard!', 'success');
            }
        }

        // EXPORTS
        async function downloadImage() {
            const el = document.getElementById('invoice-render');
            const canvas = await html2canvas(el, { scale: 3, useCORS: true });
            const l = document.createElement('a');
            l.download = `${document.getElementById('doc_id').value}.jpg`;
            l.href = canvas.toDataURL('image/jpeg', 0.95);
            l.click();
            showToast('Image saved!', 'success');
        }

        async function downloadPDF() {
            const el = document.getElementById('invoice-render');
            const canvas = await html2canvas(el, { scale: 3, useCORS: true });
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgData = canvas.toDataURL('image/png');
            const w = pdf.internal.pageSize.getWidth();
            const h = (canvas.height * w) / canvas.width;
            pdf.addImage(imgData, 'PNG', 0, 0, w, h);
            pdf.save(`${document.getElementById('doc_id').value}.pdf`);
            showToast('PDF saved!', 'success');
        }

        // HELPERS
        function renderHistory() {
            const box = document.getElementById('history-box');
            box.innerHTML = '';
            if(state.history.length === 0) box.innerHTML = '<p class="text-xs text-slate-400 italic">No history yet</p>';
            state.history.forEach(h => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3 rounded-xl bg-slate-50 dark:bg-slate-800 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 transition-all border border-transparent hover:border-emerald-200';
                btn.innerHTML = `<div class="flex justify-between"><span class="text-[10px] font-black text-emerald-600">${h.id}</span><span class="text-[10px] text-slate-400">${new Date(h.date).toLocaleDateString()}</span></div><p class="text-xs font-bold dark:text-white truncate">${h.c_name}</p>`;
                btn.onclick = () => displayShared(h);
                box.appendChild(btn);
            });
        }

        function resetAll() {
            if(confirm('Clear all fields?')) location.reload();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }

        function showToast(m, t) {
            const r = document.getElementById('toast-root');
            const d = document.createElement('div');
            d.className = `toast px-4 py-3 rounded-xl shadow-lg text-white text-xs font-bold flex items-center gap-2 ${t==='success'?'bg-emerald-600':'bg-red-500'}`;
            d.innerHTML = `<i data-lucide="${t==='success'?'check-circle':'alert-circle'}" class="w-4 h-4"></i> ${m}`;
            r.appendChild(d);
            lucide.createIcons();
            setTimeout(() => d.remove(), 3000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Service Quote Tool - Multi-Currency & Format</title>
    <!-- External Libraries for PDF and Image saving -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; color: #333; }
        .box { max-width: 500px; margin: auto; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid #ddd; }
        
        .top { background: #128C7E; color: white; padding: 25px; text-align: center; }
        .top h1 { margin: 0; font-size: 24px; }
        
        .tabs { display: flex; background: #fff; border-bottom: 1px solid #eee; }
        .tab { flex: 1; padding: 15px; border: none; background: white; font-size: 16px; font-weight: bold; cursor: pointer; color: #666; transition: 0.3s; }
        .tab.active { color: #128C7E; border-bottom: 4px solid #128C7E; background: #f9f9f9; }
        
        .content { padding: 25px; display: none; }
        .content.active { display: block; }
        
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        input, select, textarea { 
            width: 100%; padding: 14px; margin-bottom: 18px; 
            border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box;
            background: #fafafa;
        }
        
        .btn { 
            width: 100%; padding: 16px; border: none; border-radius: 8px; 
            font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px;
            transition: 0.3s;
        }
        .btn-main { background: #128C7E; color: white; }
        .btn-main:hover { background: #075e54; }
        
        .result { background: #fff; padding: 20px; border-radius: 10px; border: 2px solid #128C7E; margin-top: 20px; display: none; }
        .result.show { display: block; }
        
        .price-display { font-size: 28px; color: #128C7E; font-weight: bold; margin: 15px 0; text-align: center; }
        
        .share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .share-btn { padding: 12px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center; text-decoration: none; }
        .wa { background: #25D366; }
        .fb { background: #1877F2; }
        .tw { background: #1DA1F2; }
        .li { background: #0077B5; }
        .save-pdf { background: #E4405F; }
        .save-jpg { background: #f39c12; }

        #capture-area { padding: 20px; background: white; border-radius: 10px; }
        .watermark { font-size: 12px; color: #999; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <div class="top">
        <h1>QuickQuote Global</h1>
        <p>Professional Service Bills & Requests</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="openTab(event, 'customer')">👤 Customer</button>
        <button class="tab" onclick="openTab(event, 'worker')">🔧 Worker</button>
    </div>

    <!-- CUSTOMER AREA -->
    <div id="customer" class="content active">
        <label>Select Profession:</label>
        <select id="c_profession">
            <option value="Plumber">🚰 Plumber</option>
            <option value="Electrician">⚡ Electrician</option>
            <option value="Painter">🎨 Painter</option>
            <option value="Mechanic">🔧 Mechanic</option>
            <option value="Cleaner">🧹 Cleaner</option>
            <option value="AC Technician">❄️ AC Tech</option>
            <option value="Carpenter">🔨 Carpenter</option>
            <option value="Gardener">🌳 Gardener</option>
            <option value="Welder">🔥 Welder</option>
            <option value="Mason">🧱 Mason</option>
            <option value="Other">🛠️ Other</option>
        </select>

        <label>Currency:</label>
        <select id="c_currency">
            <option value="USD">USD ($)</option>
            <option value="EUR">EUR (€)</option>
            <option value="SAR">SAR (SR)</option>
            <option value="AED">AED (dh)</option>
            <option value="INR">INR (₹)</option>
            <option value="PKR">PKR (Rs)</option>
            <option value="GBP">GBP (£)</option>
            <option value="CAD">CAD ($)</option>
            <option value="AUD">AUD ($)</option>
            <option value="JPY">JPY (¥)</option>
        </select>

        <label>Work Description:</label>
        <textarea id="c_work" placeholder="e.g. Kitchen pipe leaking, need urgent fix."></textarea>

        <label>Your Budget:</label>
        <input type="number" id="c_price" placeholder="Amount you want to pay">

        <button class="btn btn-main" onclick="process('cust')">Preview & Save</button>

        <div id="c_res" class="result">
            <div id="c_capture">
                <div style="text-align: center; border-bottom: 2px solid #128C7E; padding-bottom: 10px; margin-bottom: 15px;">
                    <h2 style="color: #128C7E; margin: 0;">SERVICE REQUEST</h2>
                </div>
                <p><strong>Profession Needed:</strong> <span id="r_c_prof"></span></p>
                <p><strong>Description:</strong> <span id="r_c_work"></span></p>
                <div class="price-display"><span id="r_c_curr"></span> <span id="r_c_price"></span></div>
                <div class="watermark">Generated by QuickQuote Global</div>
            </div>
            
            <div class="share-grid">
                <button class="share-btn wa" onclick="shareWA('cust')">WhatsApp</button>
                <button class="share-btn fb" onclick="shareSocial('fb', 'cust')">Facebook</button>
                <button class="share-btn tw" onclick="shareSocial('tw', 'cust')">Twitter (X)</button>
                <button class="share-btn li" onclick="shareSocial('li', 'cust')">LinkedIn</button>
                <button class="share-btn save-pdf" onclick="saveFile('pdf', 'c_capture')">Save PDF</button>
                <button class="share-btn save-jpg" onclick="saveFile('jpg', 'c_capture')">Save JPG</button>
            </div>
        </div>
    </div>

    <!-- WORKER AREA -->
    <div id="worker" class="content">
        <label>Your Profession:</label>
        <select id="w_profession">
            <option value="Plumber">🚰 Plumber</option>
            <option value="Electrician">⚡ Electrician</option>
            <option value="Painter">🎨 Painter</option>
            <option value="Mechanic">🔧 Mechanic</option>
            <option value="Cleaner">🧹 Cleaner</option>
            <option value="AC Technician">❄️ AC Tech</option>
            <option value="Carpenter">🔨 Carpenter</option>
            <option value="Gardener">🌳 Gardener</option>
            <option value="Welder">🔥 Welder</option>
            <option value="Mason">🧱 Mason</option>
            <option value="Other">🛠️ Other</option>
        </select>

        <label>Currency:</label>
        <select id="w_currency">
            <option value="USD">USD ($)</option>
            <option value="EUR">EUR (€)</option>
            <option value="SAR">SAR (SR)</option>
            <option value="AED">AED (dh)</option>
            <option value="INR">INR (₹)</option>
            <option value="PKR">PKR (Rs)</option>
            <option value="GBP">GBP (£)</option>
            <option value="CAD">CAD ($)</option>
            <option value="AUD">AUD ($)</option>
            <option value="JPY">JPY (¥)</option>
        </select>

        <label>Your Name/Business:</label>
        <input type="text" id="w_name" placeholder="e.g. John's Electricals">

        <label>Work Done Details:</label>
        <textarea id="w_work" placeholder="e.g. Fixed main circuit breaker and wiring."></textarea>

        <label>Total Bill Amount:</label>
        <input type="number" id="w_price" placeholder="Enter final amount">

        <button class="btn btn-main" onclick="process('work')">Preview & Save</button>

        <div id="w_res" class="result">
            <div id="w_capture">
                <div style="text-align: center; border-bottom: 2px solid #128C7E; padding-bottom: 10px; margin-bottom: 15px;">
                    <h2 style="color: #128C7E; margin: 0;">SERVICE BILL</h2>
                </div>
                <p><strong>Provider:</strong> <span id="r_w_name"></span></p>
                <p><strong>Profession:</strong> <span id="r_w_prof"></span></p>
                <p><strong>Work Details:</strong> <span id="r_w_work"></span></p>
                <div class="price-display"><span id="r_w_curr"></span> <span id="r_w_price"></span></div>
                <div class="watermark">Generated by QuickQuote Global</div>
            </div>

            <div class="share-grid">
                <button class="share-btn wa" onclick="shareWA('work')">WhatsApp</button>
                <button class="share-btn fb" onclick="shareSocial('fb', 'work')">Facebook</button>
                <button class="share-btn tw" onclick="shareSocial('tw', 'work')">Twitter (X)</button>
                <button class="share-btn li" onclick="shareSocial('li', 'work')">LinkedIn</button>
                <button class="share-btn save-pdf" onclick="saveFile('pdf', 'w_capture')">Save PDF</button>
                <button class="share-btn save-jpg" onclick="saveFile('jpg', 'w_capture')">Save JPG</button>
            </div>
        </div>
    </div>
</div>

<script>
    function openTab(evt, tabName) {
        var i, content, tablinks;
        content = document.getElementsByClassName("content");
        for (i = 0; i < content.length; i++) { content[i].style.display = "none"; }
        tablinks = document.getElementsByClassName("tab");
        for (i = 0; i < tablinks.length; i++) { tablinks[i].className = tablinks[i].className.replace(" active", ""); }
        document.getElementById(tabName).style.display = "block";
        evt.currentTarget.className += " active";
    }

    let currentData = {};

    function process(type) {
        if(type === 'cust') {
            currentData = {
                prof: document.getElementById('c_profession').value,
                work: document.getElementById('c_work').value,
                price: document.getElementById('c_price').value,
                curr: document.getElementById('c_currency').value
            };
            document.getElementById('r_c_prof').innerText = currentData.prof;
            document.getElementById('r_c_work').innerText = currentData.work;
            document.getElementById('r_c_price').innerText = currentData.price;
            document.getElementById('r_c_curr').innerText = currentData.curr;
            document.getElementById('c_res').classList.add('show');
        } else {
            currentData = {
                name: document.getElementById('w_name').value,
                prof: document.getElementById('w_profession').value,
                work: document.getElementById('w_work').value,
                price: document.getElementById('w_price').value,
                curr: document.getElementById('w_currency').value
            };
            document.getElementById('r_w_name').innerText = currentData.name;
            document.getElementById('r_w_prof').innerText = currentData.prof;
            document.getElementById('r_w_work').innerText = currentData.work;
            document.getElementById('r_w_price').innerText = currentData.price;
            document.getElementById('r_w_curr').innerText = currentData.curr;
            document.getElementById('w_res').classList.add('show');
        }
    }

    function shareWA(type) {
        let msg = "";
        if(type === 'cust') {
            msg = `*SERVICE REQUEST*\n\n*Need:* ${currentData.prof}\n*Work:* ${currentData.work}\n*Budget:* ${currentData.curr} ${currentData.price}`;
        } else {
            msg = `*SERVICE BILL*\n\n*From:* ${currentData.name}\n*Profession:* ${currentData.prof}\n*Work:* ${currentData.work}\n*Total:* ${currentData.curr} ${currentData.price}`;
        }
        window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
    }

    function shareSocial(platform, type) {
        let text = type === 'cust' ? `Need a ${currentData.prof} for: ${currentData.work}` : `Service Bill from ${currentData.name}: ${currentData.curr} ${currentData.price}`;
        let url = window.location.href;
        let shareUrl = "";

        if(platform === 'fb') shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${encodeURIComponent(text)}`;
        if(platform === 'tw') shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${url}`;
        if(platform === 'li') shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${url}`;

        window.open(shareUrl, '_blank');
    }

    async function saveFile(format, elementId) {
        const element = document.getElementById(elementId);
        const canvas = await html2canvas(element);
        
        if(format === 'jpg') {
            const link = document.createElement('a');
            link.download = 'ServiceQuote.jpg';
            link.href = canvas.toDataURL('image/jpeg');
            link.click();
        } else if(format === 'pdf') {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgData = canvas.toDataURL('image/png');
            const imgProps = pdf.getImageProperties(imgData);
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save('ServiceQuote.pdf');
        }
    }
</script>

</body>
</html>

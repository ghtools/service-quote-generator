<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickQuote Global - Professional Service Bills</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 10px; }
        .box { max-width: 480px; margin: auto; background: white; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .top { background: #075e54; color: white; padding: 20px; text-align: center; }
        .top h1 { margin: 0; font-size: 22px; letter-spacing: 1px; }
        .tabs { display: flex; background: #fff; border-bottom: 1px solid #eee; }
        .tab { flex: 1; padding: 15px; border: none; background: white; font-size: 16px; font-weight: bold; cursor: pointer; color: #666; }
        .tab.active { color: #075e54; border-bottom: 4px solid #075e54; }
        .content { padding: 20px; display: none; }
        .content.active { display: block; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #444; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; box-sizing: border-box; background: #fafafa; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-main { background: #075e54; color: white; }
        
        /* Digital Card Style */
        .result-card { background: white; padding: 25px; border-radius: 10px; border: 1px solid #ddd; margin-top: 20px; display: none; position: relative; }
        .result-card.show { display: block; }
        .card-header { border-bottom: 2px solid #075e54; padding-bottom: 10px; margin-bottom: 15px; text-align: center; }
        .card-header h2 { color: #075e54; margin: 0; font-size: 20px; text-transform: uppercase; }
        .price-big { font-size: 32px; color: #075e54; font-weight: bold; text-align: center; margin: 20px 0; background: #e8f5e9; padding: 15px; border-radius: 8px; }
        .watermark { text-align: center; font-size: 11px; color: #888; margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
        .watermark a { color: #075e54; text-decoration: none; font-weight: bold; }
        
        .share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .s-btn { padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 13px; text-align: center; text-decoration: none; }
        .wa { background: #25D366; grid-column: span 2; font-size: 16px; }
        .save { background: #f39c12; }
        .pdf { background: #e74c3c; }
    </style>
</head>
<body>

<div class="box">
    <div class="top">
        <h1>QuickQuote Pro</h1>
        <p>Global Service Bill Generator</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="openTab(event, 'customer')">👤 Customer</button>
        <button class="tab" onclick="openTab(event, 'worker')">🔧 Worker</button>
    </div>

    <!-- CUSTOMER AREA -->
    <div id="customer" class="content active">
        <label>Work Needed:</label>
        <select id="c_prof">
            <option value="Plumber">🚰 Plumber</option>
            <option value="Electrician">⚡ Electrician</option>
            <option value="Painter">🎨 Painter</option>
            <option value="Mechanic">🔧 Mechanic</option>
            <option value="Cleaner">🧹 Cleaner</option>
            <option value="AC Tech">❄️ AC Tech</option>
            <option value="Carpenter">🔨 Carpenter</option>
            <option value="Other">🛠️ Other</option>
        </select>
        <label>Currency:</label>
        <select id="c_curr">
            <option value="USD">USD ($)</option><option value="SAR">SAR (SR)</option><option value="AED">AED (dh)</option><option value="INR">INR (₹)</option><option value="PKR">PKR (Rs)</option><option value="EUR">EUR (€)</option>
        </select>
        <label>Work Details:</label>
        <textarea id="c_work" placeholder="What needs to be fixed?"></textarea>
        <label>Your Budget:</label>
        <input type="number" id="c_price" placeholder="Amount">
        <button class="btn btn-main" onclick="gen('cust')">Create Request Card</button>

        <div id="c_res" class="result-card">
            <div id="c_cap">
                <div class="card-header"><h2>Service Request</h2></div>
                <p><strong>Service:</strong> <span id="r_c_prof"></span></p>
                <p><strong>Details:</strong> <span id="r_c_work"></span></p>
                <div class="price-big"><span id="r_c_curr"></span> <span id="r_c_price"></span></div>
                <div class="watermark">Created via <strong>QuickQuote</strong><br>service-quote-generator.vercel.app</div>
            </div>
            <button class="btn wa" onclick="share('cust')">📱 Open WhatsApp to Send</button>
            <div class="share-grid">
                <button class="s-btn save" onclick="save('jpg', 'c_cap')">🖼️ Save Photo</button>
                <button class="s-btn pdf" onclick="save('pdf', 'c_cap')">📄 Save PDF</button>
            </div>
        </div>
    </div>

    <!-- WORKER AREA -->
    <div id="worker" class="content">
        <label>Your Name:</label>
        <input type="text" id="w_name" placeholder="Name or Shop Name">
        <label>Profession:</label>
        <select id="w_prof">
            <option value="Plumber">🚰 Plumber</option><option value="Electrician">⚡ Electrician</option><option value="Painter">🎨 Painter</option><option value="Mechanic">🔧 Mechanic</option><option value="Cleaner">🧹 Cleaner</option><option value="Other">🛠️ Other</option>
        </select>
        <label>Currency:</label>
        <select id="w_curr">
            <option value="USD">USD ($)</option><option value="SAR">SAR (SR)</option><option value="AED">AED (dh)</option><option value="INR">INR (₹)</option><option value="PKR">PKR (Rs)</option>
        </select>
        <label>Work Done:</label>
        <textarea id="w_work" placeholder="What work did you do?"></textarea>
        <label>Total Bill:</label>
        <input type="number" id="w_price" placeholder="Final Amount">
        <button class="btn btn-main" onclick="gen('work')">Create Bill Card</button>

        <div id="w_res" class="result-card">
            <div id="w_cap">
                <div class="card-header"><h2>Service Bill</h2></div>
                <p><strong>From:</strong> <span id="r_w_name"></span></p>
                <p><strong>Profession:</strong> <span id="r_w_prof"></span></p>
                <p><strong>Work:</strong> <span id="r_w_work"></span></p>
                <div class="price-big"><span id="r_w_curr"></span> <span id="r_w_price"></span></div>
                <div class="watermark">Created via <strong>QuickQuote</strong><br>service-quote-generator.vercel.app</div>
            </div>
            <button class="btn wa" onclick="share('work')">📱 Open WhatsApp to Send</button>
            <div class="share-grid">
                <button class="s-btn save" onclick="save('jpg', 'w_cap')">🖼️ Save Photo</button>
                <button class="s-btn pdf" onclick="save('pdf', 'w_cap')">📄 Save PDF</button>
            </div>
        </div>
    </div>
</div>

<script>
    function openTab(e, n) {
        let c = document.getElementsByClassName("content"), t = document.getElementsByClassName("tab");
        for (let i=0; i<c.length; i++) c[i].style.display = "none";
        for (let i=0; i<t.length; i++) t[i].className = t[i].className.replace(" active", "");
        document.getElementById(n).style.display = "block"; e.currentTarget.className += " active";
    }

    let d = {};
    function gen(t) {
        if(t==='cust') {
            d={p:document.getElementById('c_prof').value, w:document.getElementById('c_work').value, pr:document.getElementById('c_price').value, cur:document.getElementById('c_curr').value};
            document.getElementById('r_c_prof').innerText=d.p; document.getElementById('r_c_work').innerText=d.w; document.getElementById('r_c_price').innerText=d.pr; document.getElementById('r_c_curr').innerText=d.cur;
            document.getElementById('c_res').classList.add('show');
        } else {
            d={n:document.getElementById('w_name').value, p:document.getElementById('w_prof').value, w:document.getElementById('w_work').value, pr:document.getElementById('w_price').value, cur:document.getElementById('w_curr').value};
            document.getElementById('r_w_name').innerText=d.n; document.getElementById('r_w_prof').innerText=d.p; document.getElementById('r_w_work').innerText=d.w; document.getElementById('r_w_price').innerText=d.pr; document.getElementById('r_w_curr').innerText=d.cur;
            document.getElementById('w_res').classList.add('show');
        }
    }

    function share(t) {
        let s = "https://service-quote-generator.vercel.app/";
        let m = t==='cust' ? `*SERVICE REQUEST*\nWork: ${d.p}\nBudget: ${d.cur} ${d.pr}\n\nGenerated via: ${s}` : `*SERVICE BILL*\nFrom: ${d.n}\nTotal: ${d.cur} ${d.pr}\n\nGenerated via: ${s}`;
        window.open("https://wa.me/?text=" + encodeURIComponent(m), "_blank");
    }

    async function save(f, id) {
        const el = document.getElementById(id);
        const canvas = await html2canvas(el, {scale: 2});
        if(f==='jpg') {
            const l = document.createElement('a'); l.download = 'ServiceBill.jpg'; l.href = canvas.toDataURL('image/jpeg', 0.9); l.click();
        } else {
            const { jsPDF } = window.jspdf; const pdf = new jsPDF('p', 'mm', 'a4');
            const imgData = canvas.toDataURL('image/png');
            const pdfW = pdf.internal.pageSize.getWidth();
            const pdfH = (canvas.height * pdfW) / canvas.width;
            pdf.addImage(imgData, 'PNG', 0, 0, pdfW, pdfH); pdf.save('ServiceBill.pdf');
        }
    }
</script>
</body>
    </html>

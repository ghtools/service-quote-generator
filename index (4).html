<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickQuote Pro - Professional Invoice & Quote Generator</title>
    <meta name="description" content="Generate professional invoices and quotes in seconds. 30+ professions, 20+ currencies. Export PDF/Image. Perfect for service businesses.">
    <meta name="keywords" content="invoice generator, quote maker, bill generator, service invoice, professional receipts">
    <link rel="canonical" href="https://service-quote-generator.vercel.app/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="QuickQuote Pro - Professional Invoice Generator">
    <meta property="og:description" content="Generate professional invoices and quotes in seconds.">
    <meta name="theme-color" content="#075e54">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * { font-family: 'Inter', sans-serif; }
        
        body {
            scroll-behavior: smooth;
            transition: background-color 0.3s ease;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .dark .glass {
            background: rgba(20, 20, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .gradient-text {
            background: linear-gradient(135deg, #075e54 0%, #25D366 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(7, 94, 84, 0.2);
        }

        .invoice-card {
            background: white;
            color: #1a1a1a;
            padding: 40px;
            min-height: 900px;
            position: relative;
            page-break-after: always;
        }

        .invoice-label {
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .invoice-value {
            color: #1e293b;
            font-size: 14px;
            font-weight: 500;
        }

        .tab-active {
            color: #075e54;
            border-bottom: 3px solid #075e54;
        }

        .dark .tab-active {
            color: #25D366;
            border-bottom-color: #25D366;
        }

        /* Responsive fixes */
        @media (max-width: 640px) {
            .invoice-card {
                padding: 20px;
                min-height: auto;
            }
            
            .grid-responsive {
                grid-template-columns: 1fr !important;
            }
        }

        /* Loading animation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        /* Smooth fade */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.3s ease forwards;
        }

        /* Success toast */
        .toast {
            animation: slideIn 0.3s ease forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        /* Input focus */
        input:focus, select:focus, textarea:focus {
            outline: none;
            ring: 2px solid #075e54 !important;
            box-shadow: 0 0 0 3px rgba(7, 94, 84, 0.1) !important;
        }

        .dark input:focus, .dark select:focus, .dark textarea:focus {
            ring: 2px solid #25D366 !important;
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.1) !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 transition-colors duration-300">

    <!-- Sticky Header -->
    <header class="fixed top-0 w-full z-50 glass border-b border-slate-200 dark:border-slate-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 min-w-0">

            </div>

            </div>
        </div>
    </header>

    <!-- View Mode: Invoice Display -->
    <div id="view-mode" class="hidden pt-20 pb-12 px-4 bg-slate-50 dark:bg-slate-950 min-h-screen">
        <div class="max-w-4xl mx-auto">
            <div class="mb-6 flex gap-3 flex-wrap">
                <button onclick="downloadInvoiceImage()" class="flex items-center gap-2 px-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-bold hover:bg-slate-50 dark:hover:bg-slate-800 transition-all">
                    <i data-lucide="image" class="w-4 h-4"></i> Download Image
                </button>
                <button onclick="downloadInvoicePDF()" class="flex items-center gap-2 px-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-bold hover:bg-slate-50 dark:hover:bg-slate-800 transition-all">
                    <i data-lucide="file-text" class="w-4 h-4"></i> Download PDF

                <button onclick="printInvoice()" class="flex items-center gap-2 px-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-bold hover:bg-slate-50 dark:hover:bg-slate-800 transition-all">

                    <i data-lucide="share-2" class="w-4 h-4"></i> Share

                <button onclick="backToForm()" class="flex items-center gap-2 px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded-lg text-sm font-bold hover:bg-slate-300 dark:hover:bg-slate-600 transition-all">

    <!-- Edit Mode: Form -->
    <div id="edit-mode" class="pt-20 pb-12 px-4">
        <!-- Hero -->
        <section class="max-w-5xl mx-auto mb-12">
            <div class="text-center mb-8">

        <!-- Main App -->

                        <!-- Worker Fields (Hidden by default) -->

                                    <input type="text" id="w_biz_name" placeholder="Your Business Name" class="w-full px-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg">
                                </div>
                                <div class="space-y-2">
                                    <label class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-300">Worker Name</label>
                                    <input type="text" id="w_name" placeholder="Your Name" class="w-full px-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg">

                            </div>
                            <div class="space-y-2">

                            <div class="space-y-2">
                                <label class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-300">Discount (%)</label>
                                <input type="number" id="discount_rate" value="0" min="0" max="100" class="w-full px-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg">

                        <!-- Payment Status -->
                        <div class="space-y-2">
                            <label class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-300">Payment Status</label>
                            <div class="flex gap-2 flex-wrap">

                        <!-- Payment Method (Worker Only) -->

                        </div>

                        <!-- Invoice History -->
                        <div class="space-y-2 pt-4 border-t border-slate-200 dark:border-slate-700">
                            <label class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-300">Recent Invoices</label>
                            <div id="history-list" class="space-y-2 max-h-32 overflow-y-auto"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Preview (Desktop Only) -->
            <div id="preview-desktop" class="hidden lg:block sticky top-24 space-y-4">
                <h2 class="text-xl font-bold dark:text-white">Live Preview</h2>
                <div class="bg-white dark:bg-slate-900 rounded-xl shadow-lg overflow-hidden border border-slate-200 dark:border-slate-700" style="max-height: 600px; overflow-y: auto;">
                    <div id="preview-invoice-card" class="invoice-card" style="min-height: auto; padding: 20px; font-size: 12px;"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-4 right-4 space-y-2 z-50 pointer-events-none"></div>

    <script>
        // ===== STATE =====
        let appState = {
            mode: 'customer',
            paymentStatus: 'Pending',
            items: [{ id: Date.now(), desc: '', amount: 0 }],
            logoBase64: null,
            history: []
        };

        // ===== INIT =====
        window.onload = () => {
            lucide.createIcons();
            loadHistory();
            setupListeners();
            generateInvoiceNumber();
            document.getElementById('invoice_date').valueAsDate = new Date();
            
            // Check for shared invoice
            const params = new URLSearchParams(window.location.search);
            if (params.has('invoice')) {
                loadSharedInvoice(params.get('invoice'));
            }
            
            // Dark mode
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }

            // PWA
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('data:application/javascript;base64,' + btoa('self.addEventListener("install",e=>e.waitUntil(caches.open("qq-v1")));self.addEventListener("fetch",e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));'));
            }

            // Install prompt
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                const btn = document.getElementById('installApp');
                btn.classList.remove('hidden');
                btn.addEventListener('click', async () => {
                    e.prompt();
                    const { outcome } = await e.userChoice;
                    if (outcome === 'accepted') e.preventDefault();
                });
            });
        };

        function setupListeners() {
            const fields = ['c_name', 'c_phone', 'c_address', 'profession_select', 'currency_select', 'w_biz_name', 'w_name', 'tax_rate', 'discount_rate', 'invoice_date', 'notes'];
            fields.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', updatePreview);
            });

            document.getElementById('w_logo').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        appState.logoBase64 = reader.result;
                        updatePreview();
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        // ===== MODE SWITCHING =====
        function switchMode(mode) {
            appState.mode = mode;
            document.getElementById('tab-customer').className = `flex-1 pb-4 font-bold text-base transition-all ${mode === 'customer' ? 'tab-active' : 'text-slate-400'}`;
            document.getElementById('tab-worker').className = `flex-1 pb-4 font-bold text-base transition-all ${mode === 'worker' ? 'tab-active' : 'text-slate-400'}`;
            document.getElementById('worker-section').classList.toggle('hidden', mode !== 'worker');
            document.getElementById('payment-method-section').classList.toggle('hidden', mode !== 'worker');
            document.getElementById('num-label').innerText = mode === 'customer' ? 'Request Number' : 'Invoice Number';
            generateInvoiceNumber();
            updatePreview();
        }

        function generateInvoiceNumber() {
            const d = new Date();
            const dateStr = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
            const prefix = appState.mode === 'customer' ? 'REQ' : 'INV';
            const rand = Math.floor(10000 + Math.random() * 90000);
            document.getElementById('invoice_num').value = `${prefix}-${dateStr}-${rand}`;
        }

        // ===== ITEMS MANAGEMENT =====
        function addItem() {
            appState.items.push({ id: Date.now(), desc: '', amount: 0 });
            renderItems();
            updatePreview();
        }

        function removeItem(id) {
            if (appState.items.length > 1) {
                appState.items = appState.items.filter(item => item.id !== id);
                renderItems();
                updatePreview();
            } else {
                showToast('At least one item is required', 'warning');
            }
        }

        function renderItems() {
            const container = document.getElementById('items-list');
            container.innerHTML = '';
            appState.items.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'flex gap-2 items-end animate-fade';
                div.innerHTML = `
                    <input type="text" placeholder="Service..." value="${item.desc}" oninput="updateItemField(${item.id}, 'desc', this.value)" class="flex-[2] px-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm">
                    <input type="number" placeholder="0" value="${item.amount}" oninput="updateItemField(${item.id}, 'amount', this.value)" class="flex-1 px-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm">
                    <button onclick="removeItem(${item.id})" class="p-2 text-slate-300 hover:text-red-500 transition-colors flex-shrink-0">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                `;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        function updateItemField(id, key, val) {
            const item = appState.items.find(i => i.id === id);
            if (item) {
                item[key] = key === 'amount' ? parseFloat(val) || 0 : val;
                updatePreview();
            }
        }

        // ===== PREVIEW =====
        function updatePreview() {
            const invoiceNum = document.getElementById('invoice_num').value;
            const date = document.getElementById('invoice_date').value;
            const cName = document.getElementById('c_name').value || 'Valued Customer';
            const cPhone = document.getElementById('c_phone').value;
            const cAddress = document.getElementById('c_address').value;
            const prof = document.getElementById('profession_select').value;
            const curr = document.getElementById('currency_select').value;
            const bizName = document.getElementById('w_biz_name').value || 'Your Business';
            const wName = document.getElementById('w_name').value;
            const taxR = parseFloat(document.getElementById('tax_rate').value) || 0;
            const discR = parseFloat(document.getElementById('discount_rate').value) || 0;
            const notes = document.getElementById('notes').value;
            const payMethod = document.getElementById('payment_method').value;

            const sym = getCurrencySymbol(curr);

            // Calculate totals
            let subtotal = 0;
            appState.items.forEach(item => subtotal += item.amount);
            const tax = (subtotal * taxR) / 100;
            const disc = (subtotal * discR) / 100;
            const total = subtotal + tax - disc;

            // Build invoice HTML
            let html = `
                <div class="flex justify-between items-start mb-6">
                    <div>
                        ${appState.logoBase64 ? `<img src="${appState.logoBase64}" class="w-12 h-12 rounded object-cover">` : `<div class="w-12 h-12 bg-emerald-100 rounded flex items-center justify-center"><i data-lucide="briefcase" class="w-6 h-6 text-emerald-600"></i></div>`}
                    </div>
                    <div class="text-right">
                        <h3 class="text-2xl font-black uppercase">${appState.mode === 'customer' ? 'REQUEST' : 'INVOICE'}</h3>
                        <p class="text-xs text-slate-400 font-mono">${invoiceNum}</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6 mb-6 text-xs">
                    <div>
                        <p class="invoice-label mb-1">From</p>
                        <p class="font-bold">${appState.mode === 'worker' ? bizName : 'Service Request'}</p>
                        <p class="text-slate-500 text-[10px]">${prof}</p>
                    </div>
                    <div class="text-right">
                        <p class="invoice-label mb-1">Bill To</p>
                        <p class="font-bold">${cName}</p>
                        ${cPhone ? `<p class="text-slate-500 text-[10px]">${cPhone}</p>` : ''}
                        ${cAddress ? `<p class="text-slate-500 text-[10px]">${cAddress}</p>` : ''}
                        <p class="text-slate-500 text-[10px]">${new Date(date).toLocaleDateString()}</p>
                    </div>
                </div>

                <div class="border-y border-slate-200 py-4 mb-6">
                    <div class="grid grid-cols-12 gap-2 mb-3">
                        <div class="col-span-8 invoice-label">Description</div>
                        <div class="col-span-4 invoice-label text-right">Amount</div>
                    </div>
                    ${appState.items.map(item => `
                        <div class="grid grid-cols-12 gap-2 text-xs py-2 border-b border-slate-50">
                            <div class="col-span-8 font-medium">${item.desc || 'Service'}</div>
                            <div class="col-span-4 text-right font-bold">${sym}${item.amount.toFixed(2)}</div>
                        </div>
                    `).join('')}
                </div>

                <div class="flex justify-end mb-6">
                    <div class="w-full max-w-xs space-y-2 text-xs">
                        <div class="flex justify-between">
                            <span class="text-slate-500">Subtotal</span>
                            <span class="font-bold">${sym}${subtotal.toFixed(2)}</span>
                        </div>
                        ${taxR > 0 ? `
                            <div class="flex justify-between">
                                <span class="text-slate-500">Tax (${taxR}%)</span>
                                <span class="font-bold">${sym}${tax.toFixed(2)}</span>
                            </div>
                        ` : ''}
                        ${discR > 0 ? `
                            <div class="flex justify-between">
                                <span class="text-slate-500">Discount (${discR}%)</span>
                                <span class="font-bold">-${sym}${disc.toFixed(2)}</span>
                            </div>
                        ` : ''}
                        <div class="flex justify-between items-center pt-2 border-t border-slate-200">
                            <span class="font-black uppercase">Total</span>
                            <span class="text-lg font-black text-emerald-600">${sym}${total.toFixed(2)}</span>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-end">
                    <div id="qr-code-mini"></div>
                    <div class="text-right">
                        <div class="inline-block px-3 py-1 rounded-full text-[9px] font-black uppercase mb-2 ${
                            appState.paymentStatus === 'Paid' ? 'bg-emerald-600 text-white' :
                            appState.paymentStatus === 'Pending' ? 'bg-amber-500 text-white' :
                            'bg-blue-600 text-white'
                        }">
                            ${appState.paymentStatus}
                        </div>
                        ${appState.mode === 'worker' && appState.paymentStatus !== 'Pending' ? `
                            <p class="text-[9px] text-slate-500 mb-1">Payment: ${payMethod}</p>
                        ` : ''}
                        <div class="text-[8px] text-slate-300 font-bold uppercase tracking-wider leading-tight">
                            Created via QuickQuote Pro<br>
                            service-quote-generator.vercel.app
                        </div>
                    </div>
                </div>

                ${notes ? `<div class="mt-6 pt-4 border-t border-slate-200 text-xs"><p class="text-slate-500">Notes:</p><p class="text-slate-700">${notes}</p></div>` : ''}
            `;

            // Update both preview areas
            const previewCard = document.getElementById('preview-invoice-card');
            if (previewCard) {
                previewCard.innerHTML = html;
                lucide.createIcons();
                generateQRMini();
            }
        }

        function generateQRMini() {
            const container = document.getElementById('qr-code-mini');
            if (container) {
                container.innerHTML = '';
                new QRCode(container, {
                    text: window.location.href,
                    width: 50,
                    height: 50,
                    colorDark: '#075e54',
                    colorLight: '#ffffff'
                });
            }
        }

        // ===== ACTIONS =====
        function setStatus(status) {
            appState.paymentStatus = status;
            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.className = `status-btn flex-1 min-w-[80px] py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-xs sm:text-sm font-bold transition-all ${
                    btn.innerText === status ? 'bg-emerald-600 text-white border-emerald-600' : 'hover:bg-emerald-50 dark:hover:bg-emerald-900/20'
                }`;
            });
            updatePreview();
        }

        function generatePreview() {
            if (!document.getElementById('c_name').value) {
                showToast('Please enter customer name', 'error');
                return;
            }
            
            // Save to history
            saveToHistory();
            
            // Show view mode
            document.getElementById('edit-mode').classList.add('hidden');
            document.getElementById('view-mode').classList.remove('hidden');
            
            // Generate full invoice
            generateFullInvoice();
            
            window.scrollTo(0, 0);
        }

        function generateFullInvoice() {
            const invoiceNum = document.getElementById('invoice_num').value;
            const date = document.getElementById('invoice_date').value;
            const cName = document.getElementById('c_name').value || 'Valued Customer';
            const cPhone = document.getElementById('c_phone').value;
            const cAddress = document.getElementById('c_address').value;
            const prof = document.getElementById('profession_select').value;
            const curr = document.getElementById('currency_select').value;
            const bizName = document.getElementById('w_biz_name').value || 'Your Business';
            const taxR = parseFloat(document.getElementById('tax_rate').value) || 0;
            const discR = parseFloat(document.getElementById('discount_rate').value) || 0;
            const notes = document.getElementById('notes').value;
            const payMethod = document.getElementById('payment_method').value;

            const sym = getCurrencySymbol(curr);

            // Calculate totals
            let subtotal = 0;
            appState.items.forEach(item => subtotal += item.amount);
            const tax = (subtotal * taxR) / 100;
            const disc = (subtotal * discR) / 100;
            const total = subtotal + tax - disc;

            // Build full invoice
            let html = `
                <div class="flex justify-between items-start mb-8">
                    <div>
                        ${appState.logoBase64 ? `<img src="${appState.logoBase64}" class="w-16 h-16 rounded object-cover">` : `<div class="w-16 h-16 bg-emerald-100 rounded flex items-center justify-center"><i data-lucide="briefcase" class="w-8 h-8 text-emerald-600"></i></div>`}
                    </div>
                    <div class="text-right">
                        <h3 class="text-3xl font-black uppercase">${appState.mode === 'customer' ? 'REQUEST' : 'INVOICE'}</h3>
                        <p class="text-slate-400 font-mono text-sm">${invoiceNum}</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-8 mb-8">
                    <div>
                        <p class="invoice-label mb-2">From</p>
                        <p class="font-bold text-lg">${appState.mode === 'worker' ? bizName : 'Service Request'}</p>
                        <p class="text-slate-500 text-sm">${prof}</p>
                    </div>
                    <div class="text-right">
                        <p class="invoice-label mb-2">Bill To</p>
                        <p class="font-bold text-lg">${cName}</p>
                        ${cPhone ? `<p class="text-slate-500 text-sm">${cPhone}</p>` : ''}
                        ${cAddress ? `<p class="text-slate-500 text-sm">${cAddress}</p>` : ''}
                        <p class="text-slate-500 text-sm">${new Date(date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
                    </div>
                </div>

                <div class="border-y-2 border-slate-900 py-6 mb-8">
                    <div class="grid grid-cols-12 gap-4 mb-4">
                        <div class="col-span-8 invoice-label">Description</div>
                        <div class="col-span-4 invoice-label text-right">Amount</div>
                    </div>
                    ${appState.items.map(item => `
                        <div class="grid grid-cols-12 gap-4 py-3 border-b border-slate-100">
                            <div class="col-span-8 font-medium text-slate-700">${item.desc || 'Service'}</div>
                            <div class="col-span-4 text-right font-bold text-slate-900">${sym}${item.amount.toFixed(2)}</div>
                        </div>
                    `).join('')}
                </div>

                <div class="flex justify-end mb-8">
                    <div class="w-full max-w-xs space-y-3">
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-500">Subtotal</span>
                            <span class="font-bold">${sym}${subtotal.toFixed(2)}</span>
                        </div>
                        ${taxR > 0 ? `
                            <div class="flex justify-between text-sm">
                                <span class="text-slate-500">Tax (${taxR}%)</span>
                                <span class="font-bold">${sym}${tax.toFixed(2)}</span>
                            </div>
                        ` : ''}
                        ${discR > 0 ? `
                            <div class="flex justify-between text-sm">
                                <span class="text-slate-500">Discount (${discR}%)</span>
                                <span class="font-bold">-${sym}${disc.toFixed(2)}</span>
                            </div>
                        ` : ''}
                        <div class="flex justify-between items-center pt-4 border-t-2 border-slate-900">
                            <span class="text-lg font-black uppercase">Total</span>
                            <span class="text-4xl font-black text-emerald-600">${sym}${total.toFixed(2)}</span>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-end">
                    <div id="qr-code-full"></div>
                    <div class="text-right">
                        <div class="inline-block px-4 py-2 rounded-full text-xs font-black uppercase mb-4 ${
                            appState.paymentStatus === 'Paid' ? 'bg-emerald-600 text-white' :
                            appState.paymentStatus === 'Pending' ? 'bg-amber-500 text-white' :
                            'bg-blue-600 text-white'
                        }">
                            ${appState.paymentStatus}
                        </div>
                        ${appState.mode === 'worker' && appState.paymentStatus !== 'Pending' ? `
                            <p class="text-xs text-slate-500 mb-2">Payment: ${payMethod}</p>
                        ` : ''}
                        <div class="text-xs text-slate-300 font-bold uppercase tracking-widest leading-relaxed">
                            Created via QuickQuote Pro<br>
                            service-quote-generator.vercel.app
                        </div>
                    </div>
                </div>

                ${notes ? `<div class="mt-8 pt-6 border-t border-slate-200"><p class="invoice-label mb-2">Notes</p><p class="text-slate-700">${notes}</p></div>` : ''}
            `;

            document.getElementById('view-invoice-card').innerHTML = html;
            lucide.createIcons();
            generateQRFull();
        }

        function generateQRFull() {
            const container = document.getElementById('qr-code-full');
            if (container) {
                container.innerHTML = '';
                const invoiceNum = document.getElementById('invoice_num').value;
                const shareUrl = `${window.location.origin}${window.location.pathname}?invoice=${encodeURIComponent(invoiceNum)}`;
                new QRCode(container, {
                    text: shareUrl,
                    width: 80,
                    height: 80,
                    colorDark: '#075e54',
                    colorLight: '#ffffff'
                });
            }
        }

        async function downloadInvoiceImage() {
            const element = document.getElementById('view-invoice-card');
            try {
                const canvas = await html2canvas(element, { scale: 3, useCORS: true });
                const link = document.createElement('a');
                link.download = `${document.getElementById('invoice_num').value}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
                showToast('Image downloaded successfully!', 'success');
            } catch (e) {
                showToast('Error downloading image', 'error');
            }
        }

        async function downloadInvoicePDF() {
            const element = document.getElementById('view-invoice-card');
            try {
                const canvas = await html2canvas(element, { scale: 3, useCORS: true });
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgData = canvas.toDataURL('image/png');
                const pdfW = pdf.internal.pageSize.getWidth();
                const pdfH = (canvas.height * pdfW) / canvas.width;
                pdf.addImage(imgData, 'PNG', 0, 0, pdfW, pdfH);
                pdf.save(`${document.getElementById('invoice_num').value}.pdf`);
                showToast('PDF downloaded successfully!', 'success');
            } catch (e) {
                showToast('Error downloading PDF', 'error');
            }
        }

        function printInvoice() {
            const printWindow = window.open('', '', 'height=800,width=900');
            printWindow.document.write(document.getElementById('view-invoice-card').innerHTML);
            printWindow.document.close();
            printWindow.print();
        }

        function shareInvoice() {
            const invoiceNum = document.getElementById('invoice_num').value;
            const shareUrl = `${window.location.origin}${window.location.pathname}?invoice=${encodeURIComponent(invoiceNum)}`;
            
            if (navigator.share) {
                navigator.share({
                    title: `Invoice ${invoiceNum}`,
                    text: 'View my invoice',
                    url: shareUrl
                });
            } else {
                navigator.clipboard.writeText(shareUrl);
                showToast('Invoice link copied to clipboard!', 'success');
            }
        }

        function backToForm() {
            document.getElementById('view-mode').classList.add('hidden');
            document.getElementById('edit-mode').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function resetForm() {
            if (confirm('Start a new invoice? All fields will be cleared.')) {
                appState.items = [{ id: Date.now(), desc: '', amount: 0 }];
                document.getElementById('c_name').value = '';
                document.getElementById('c_phone').value = '';
                document.getElementById('c_address').value = '';
                document.getElementById('w_biz_name').value = '';
                document.getElementById('w_name').value = '';
                document.getElementById('tax_rate').value = 0;
                document.getElementById('discount_rate').value = 0;
                document.getElementById('notes').value = '';
                appState.logoBase64 = null;
                document.getElementById('w_logo').value = '';
                generateInvoiceNumber();
                renderItems();
                updatePreview();
                showToast('Form cleared!', 'success');
            }
        }

        // ===== HISTORY =====
        function saveToHistory() {
            const invoice = {
                num: document.getElementById('invoice_num').value,
                date: document.getElementById('invoice_date').value,
                customer: document.getElementById('c_name').value,
                amount: appState.items.reduce((sum, item) => sum + item.amount, 0),
                timestamp: Date.now()
            };
            
            appState.history.unshift(invoice);
            if (appState.history.length > 20) appState.history.pop();
            localStorage.setItem('qq_history', JSON.stringify(appState.history));
            renderHistory();
        }

        function loadHistory() {
            const saved = localStorage.getItem('qq_history');
            if (saved) {
                appState.history = JSON.parse(saved);
                renderHistory();
            }
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            container.innerHTML = '';
            appState.history.slice(0, 5).forEach(inv => {
                const div = document.createElement('button');
                div.className = 'w-full text-left p-2 rounded bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all text-xs';
                div.innerHTML = `<p class="font-bold">${inv.num}</p><p class="text-slate-500">${inv.customer} • ${new Date(inv.timestamp).toLocaleDateString()}</p>`;
                div.onclick = () => loadInvoiceFromHistory(inv.num);
                container.appendChild(div);
            });
        }

        function loadInvoiceFromHistory(num) {
            // Load invoice data from history
            showToast('Loading invoice...', 'info');
            // Implementation would load the full invoice data
        }

        // ===== UTILITIES =====
        function getCurrencySymbol(c) {
            const symbols = {
                USD: '$', EUR: '€', GBP: '£', SAR: 'SR', AED: 'dh', QAR: 'QR', KWD: 'KD', BHD: 'BD', OMR: 'OR',
                PKR: 'Rs', INR: '₹', BDT: 'Tk', NPR: 'Rs', LKR: 'Rs', SGD: '$', MYR: 'RM', CAD: '$', AUD: '$', JPY: '¥', TRY: '₺', ZAR: 'R'
            };
            return symbols[c] || '$';
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast p-4 rounded-lg text-white text-sm font-bold ${
                type === 'success' ? 'bg-emerald-600' :
                type === 'error' ? 'bg-red-600' :
                type === 'warning' ? 'bg-amber-600' :
                'bg-blue-600'
            }`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function loadSharedInvoice(num) {
            // Load shared invoice from URL parameter
            showToast('Loading shared invoice...', 'info');
        }
    </script>
</body>
